name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/menil/jobgitops:latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Installer Dependencies
        run: npm ci --prefix installer

      - name: Ensure Shellcheck
        run: command -v shellcheck || { apt-get update && apt-get install -y --no-install-recommends shellcheck; }

      - name: Run Validation Checks
        run: just validate
