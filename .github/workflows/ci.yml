name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/menil/jobgitops:latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Installer Dependencies
        run: npm ci --prefix installer

      # Gate on the dependencies that ship to npm users. Dev-toolchain
      # findings (vitest/vite/esbuild) are tracked separately and must not
      # block unrelated work.
      #
      # Deliberate blocking behavior: npm audit reads the live advisory DB,
      # so a freshly published high/critical advisory fails in-flight PRs
      # until a fix lands. That urgency is intended for a public npm
      # package. Unblock path: merge the pending Dependabot security PR
      # (it arrives within hours); do not soften this step instead.
      - name: Audit Production Dependencies
        run: npm audit --omit=dev --audit-level=high --prefix installer

      - name: Ensure Shellcheck
        run: command -v shellcheck || { apt-get update && apt-get install -y --no-install-recommends shellcheck; }

      - name: Run Validation Checks
        run: just validate
