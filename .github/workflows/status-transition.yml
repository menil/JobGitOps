name: Transition Job Status

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

jobs:
  transition:
    # Any lifecycle label addition owns a column move (label -> column). The
    # reverse direction lives in project-status-sync.yml; together they converge
    # because re-setting an already-set column emits no `edited` event.
    # This list MUST stay in sync with `LIFECYCLE_LABELS` in
    # src/jobgitops/status_model.py (the single source of truth).
    if: |
      contains(fromJSON('["triage-pending","ready-to-apply","applied","in-loop","offer-received","rejected","triage-mismatched"]'), github.event.label.name)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Install Devenv
        run: nix profile install nixpkgs#devenv

      - name: Run Status Transition Script
        run: devenv shell python src/status_transition.py --event-path "$GITHUB_EVENT_PATH"
        env:
          GITHUB_TOKEN: ${{ secrets.PROJECT_V2_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
