name: Transition Job Status

on:
  issues:
    types: [labeled, closed]

permissions:
  contents: read
  issues: write
  packages: read

jobs:
  transition:
    # Any lifecycle label addition or issue closure owns a column move. The
    # reverse direction lives in project-status-sync.yml.
    # This list MUST stay in sync with `LIFECYCLE_LABELS` in
    # src/jobgitops/status_model.py (the single source of truth).
    if: |
      github.event.action == 'closed' ||
      (github.event.action == 'labeled' && contains(fromJSON('["triage-pending","ready-to-apply","applied","in-loop","offer-received","rejected","triage-mismatched"]'), github.event.label.name))
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.RUNNER_IMAGE }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync Dependencies
        run: uv sync --frozen --no-install-project

      - name: Run Status Transition Script
        run: python src/status_transition.py --event-path "$GITHUB_EVENT_PATH"
        env:
          GITHUB_TOKEN: ${{ secrets.PROJECT_V2_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
