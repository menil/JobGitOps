name: Respond to Issue

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

concurrency:
  group: respond-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  packages: read

jobs:
  respond:
    # Never act on pull-request threads (issue_comment fires for PRs too).
    # For issues:opened, short-circuit scraper-created issues (labeled
    # triage-pending at creation) so they don't spin up a Nix job only to be
    # skipped by respond.py's should_auto_detect guard. The full job-label
    # set stays in respond.py; triage-pending is the only pipeline label
    # present in an opened event.
    if: >-
      github.event.issue.pull_request == null
      && (github.event_name == 'issue_comment'
          || !contains(github.event.issue.labels.*.name, 'triage-pending'))
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.RUNNER_IMAGE }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync Dependencies
        run: uv sync --frozen --no-install-project

      - name: Run Issue Responder
        run: |
          set -e
          python -m jobgitops.cli.respond --event-path "$GITHUB_EVENT_PATH"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_V2_TOKEN: ${{ secrets.PROJECT_V2_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          AGENT_BOT_LOGINS: ${{ vars.AGENT_BOT_LOGINS }}
