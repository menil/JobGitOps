name: Triage and Tailor Issue

on:
  issues:
    types: [opened, labeled]
  workflow_run:
    workflows: [Daily Job Scraper]
    types: [completed]

concurrency:
  group: triage
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

jobs:
  triage:
    if: >
      github.event_name == 'workflow_run'
      || contains(github.event.issue.labels.*.name, 'triage-pending')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Install Devenv
        run: nix profile install nixpkgs#devenv

      - name: Run Triage Coordinator
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            devenv shell python src/triage.py --all-pending
          else
            devenv shell python src/triage.py --event-path "$GITHUB_EVENT_PATH"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.PROJECT_V2_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
