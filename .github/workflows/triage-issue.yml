name: Triage and Tailor Issue

on:
  issues:
    types: [opened, labeled]
  workflow_run:
    workflows: [Daily Job Scraper]
    types: [completed]

concurrency:
  group: triage
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  packages: read

jobs:
  triage:
    if: >
      github.event_name == 'workflow_run'
      || contains(github.event.issue.labels.*.name, 'triage-pending')
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.RUNNER_IMAGE }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync Dependencies
        run: uv sync --frozen --no-install-project

      - name: Run Triage Coordinator
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            python src/triage.py --all-pending
          else
            python src/triage.py --event-path "$GITHUB_EVENT_PATH"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_V2_TOKEN: ${{ secrets.PROJECT_V2_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
