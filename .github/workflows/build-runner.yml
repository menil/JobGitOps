name: Build and Push Runner Image

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]*'
    paths:
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'src/**'
      - '.github/workflows/build-runner.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert Repository Name to Lowercase
        id: image-name
        run: |
          RAW_IMAGE="ghcr.io/${{ github.repository }}"
          echo "image=$(echo "$RAW_IMAGE" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # Tag strategy (spec §6.3): main push -> :latest + :<sha>; tag vX.Y.Z -> :vX.Y.Z + :latest.
      # 'latest' is emitted unconditionally: the trigger already restricts
      # builds to main pushes and v* tags, and 'is_default_branch' is false for
      # tag events, so gating latest on it would skip the :latest refresh on a
      # release tag push.
      - name: Generate Docker Image Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image-name.outputs.image }}
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=sha,prefix=,format=long

      - name: Build Docker Image (local, for smoke test)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ${{ steps.image-name.outputs.image }}:ci-smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Guards against the exact class of regression this image is prone to:
      # a `oven/bun:latest` bump, a Debian `chromium` point release, or a
      # `resumed`/Puppeteer update silently breaking the hand-verified
      # invocation contract documented in the Dockerfile (privilege-dropped
      # `pptruser`, `--puppeteer-arg=--no-sandbox`, the apt-installed
      # Chromium path). `docker build` succeeding proves none of that; only
      # actually running `resumed export` does.
      - name: Smoke-test tools in built image
        run: |
          docker run --rm \
            -v "$PWD/.github/fixtures:/work" -w /work \
            "${{ steps.image-name.outputs.image }}:ci-smoke-test" \
            sh -c '
              su -s /bin/sh pptruser -c "pdf-vdiff --help" &&
              su -s /bin/sh pptruser -c "bun /opt/bun/bin/resumed export resume.json -t @jsonresume/jsonresume-theme-professional -o /tmp/resume.pdf --puppeteer-arg=--no-sandbox" &&
              [ -s /tmp/resume.pdf ]
            '

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
