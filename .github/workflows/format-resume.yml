name: Auto-Format Resume

on:
  push:
    branches:
      - main
    paths:
      - 'resumes/resume.yaml'

concurrency:
  group: push-main-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/menil/jobgitops:latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Format Resume
        run: |
          python -c "
          from jobgitops.loader import load_resume, render_resume_yaml
          import pathlib
          p = pathlib.Path('resumes/resume.yaml')
          if p.exists():
              content = p.read_text(encoding='utf-8')
              # Skip formatting if the repository is still using the placeholder resume
              if '__JOBGITOPS_SETUP_PENDING__' in content:
                  print('Setup is pending - skipping format.')
              else:
                  p.write_text(render_resume_yaml(load_resume(p)), encoding='utf-8')
          "

      - name: Commit and Push If Changed
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ -n "$(git status --porcelain resumes/resume.yaml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add resumes/resume.yaml
            git commit -m "chore: format resume.yaml"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          else
            echo "Resume is already canonically formatted."
          fi
