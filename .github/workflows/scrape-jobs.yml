name: Daily Job Scraper

on:
  schedule:
    - cron: '0 0 * * *'  # Run daily at midnight UTC
  workflow_dispatch:
    inputs:
      location:
        description: 'Override search location (e.g. Remote, "Seattle, WA")'
        required: false
        default: 'Remote'
      job_type:
        description: 'Override employment type (fulltime, contract, parttime, internship)'
        required: false
        default: 'fulltime'
      hours_old:
        description: 'Only search for jobs posted within the last N hours'
        required: false
        default: '24'
      dry_run:
        description: 'Run in dry-run mode (skip writing to remote GitHub APIs)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Install Devenv
        run: nix profile install nixpkgs#devenv

      - name: Run Job Scraper
        env:
          GITHUB_TOKEN: ${{ secrets.PROJECT_V2_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          INPUT_LOCATION: ${{ github.event.inputs.location }}
          INPUT_JOB_TYPE: ${{ github.event.inputs.job_type }}
          INPUT_HOURS_OLD: ${{ github.event.inputs.hours_old }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "$INPUT_LOCATION" ]; then
              ARGS+=("--location" "$INPUT_LOCATION")
            fi
            if [ -n "$INPUT_JOB_TYPE" ]; then
              ARGS+=("--job-type" "$INPUT_JOB_TYPE")
            fi
            if [ -n "$INPUT_HOURS_OLD" ]; then
              ARGS+=("--hours-old" "$INPUT_HOURS_OLD")
            fi
            if [ "$INPUT_DRY_RUN" = "true" ]; then
              ARGS+=("--dry-run")
            fi
          fi
          devenv shell python src/scrape.py "${ARGS[@]}"
