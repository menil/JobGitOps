[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "jobgitops"
version = "0.1.0"
description = "GitOps-driven job application and tracking system"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "weasyprint",
    "jinja2",
    "pyyaml",
    "python-jobspy",
    "google-generativeai",
    # ddgs is an unofficial DDG client that tracks DDG's site structure and can
    # break unannounced when DDG changes markup. Keep a floor (not an exact pin)
    # so upgrades can pick up fixes quickly. uv.lock still pins the exact
    # resolved version.
    "ddgs>=9.14.4",
    "trafilatura>=2.2.0",
    # numpy>=1.26.0 provides prebuilt wheels for Python 3.12+ and avoids distutils
    "numpy>=1.26.0",
    "pandas>=2.2.0",
]

[project.scripts]
jobgitops-scrape = "jobgitops.cli.scrape:main"
jobgitops-triage = "jobgitops.cli.triage:main"
jobgitops-respond = "jobgitops.cli.respond:main"
jobgitops-project-sync = "jobgitops.cli.project_sync:main"
jobgitops-status-transition = "jobgitops.cli.status_transition:main"
jobgitops-validate-resume = "jobgitops.cli.validate_resume:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "PTH"]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/jobgitops/__init__.py",
]

[tool.coverage.report]
exclude_also = [
    "def __repr__",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
