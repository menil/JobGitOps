[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "gitemployed"
version = "0.1.0"
description = "GitOps-driven job application and tracking system"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pyyaml",
    "python-jobspy",
    "google-generativeai",
    # Already fully resolved transitively via google-generativeai (see
    # uv.lock); promoted to direct deps for the Gmail integration
    # (specs/gmail-integration.md §5.1, §13.7).
    "google-api-python-client",
    "google-auth",
    "pydantic>=2.7.0",
    "litellm>=1.40.0",
    # ddgs is an unofficial DDG client that tracks DDG's site structure and can
    # break unannounced when DDG changes markup. Keep a floor (not an exact pin)
    # so upgrades can pick up fixes quickly. uv.lock still pins the exact
    # resolved version.
    "ddgs>=9.14.4",
    "trafilatura>=2.2.0",
    # numpy>=1.26.0 provides prebuilt wheels for Python 3.12+ and avoids distutils
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    # openpyxl is required as pandas' XLSX write engine for
    # DataFrame.to_excel(engine="openpyxl") (specs/esd-export.md §6.2).
    "openpyxl>=3.1.0",
]

[project.scripts]
gitemployed-scrape = "gitemployed.cli.scrape:main"
gitemployed-triage = "gitemployed.cli.triage:main"
gitemployed-respond = "gitemployed.cli.respond:main"
gitemployed-project-sync = "gitemployed.cli.project_sync:main"
gitemployed-status-transition = "gitemployed.cli.status_transition:main"
gitemployed-validate-resume = "gitemployed.cli.validate_resume:main"
gitemployed-esd-export = "gitemployed.cli.esd_export:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "PTH"]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/gitemployed/__init__.py",
]

[tool.coverage.report]
exclude_also = [
    "def __repr__",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
