name: Transition Job Status

on:
  issues:
    types: [labeled, closed]

permissions:
  contents: read
  issues: write
  packages: read

# Serialize transitions per issue so overlapping events (labeled then quick
# closed) cannot interleave their column writes; the newest intent's run
# supersedes older ones instead of racing them.
concurrency:
  group: status-transition-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  transition:
    # Any lifecycle label addition or issue closure owns a column move. The
    # reverse direction lives in project-status-sync.yml.
    # This list MUST stay in sync with `LIFECYCLE_LABELS` in
    # src/jobgitops/status_model.py (the single source of truth).
    if: |
      github.event.action == 'closed' ||
      (github.event.action == 'labeled' && contains(fromJSON('["triage-pending","ready-to-apply","applied","in-loop","offer-received","rejected","triage-mismatched"]'), github.event.label.name))
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/menil/jobgitops:latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Status Transition Script
        run: python -m jobgitops.cli.status_transition --event-path "$GITHUB_EVENT_PATH"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
