name: Sync Project Status to Label

on:
  schedule:
    - cron: '*/30 * * * *'  # Runs every 30 minutes
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  packages: read

# Serialize runs so rapid column moves never race the reverse sync, and bail
# out of a wedged run instead of burning a runner for hours.
concurrency:
  group: project-status-sync
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - name: Verify GH_PAT is set
        id: token
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "::warning::GH_PAT secret is not set — skipping sync."
            echo "has_gh_pat=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_gh_pat=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: Restore last-sync timestamp
        if: steps.token.outputs.has_gh_pat == 'true'
        id: cache
        uses: actions/cache/restore@v4
        with:
          key: project-status-sync-last-run-${{ github.run_id }}
          restore-keys: project-status-sync-last-run-
          path: /tmp/last-sync-timestamp

      - name: Check for recent issue activity
        if: steps.token.outputs.has_gh_pat == 'true'
        id: check
        run: |
          if [ -f /tmp/last-sync-timestamp ]; then
            SINCE=$(cat /tmp/last-sync-timestamp)
          else
            # GNU coreutils (ubuntu-latest); BSD fallback for local macOS testing.
            SINCE=$(date -u -d '1 hour ago' '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null \
                     || date -u -v-1H '+%Y-%m-%dT%H:%M:%SZ')
          fi

          UPDATED=$(gh api "repos/{owner}/{repo}/issues?since=${SINCE}&state=all&per_page=1" \
            --jq 'length')

          if [ "$UPDATED" -gt 0 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

          date -u '+%Y-%m-%dT%H:%M:%SZ' > /tmp/last-sync-timestamp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save last-sync timestamp
        if: always() && steps.token.outputs.has_gh_pat == 'true'
        uses: actions/cache/save@v4
        with:
          key: project-status-sync-last-run-${{ github.run_id }}
          path: /tmp/last-sync-timestamp

  sync:
    needs: guard
    if: needs.guard.outputs.has_changes == 'true'
    # Reverse direction (column -> label) runs on a schedule or dispatch.
    # The forward direction (label -> column) lives in status-transition.yml.
    # They converge safely without feedback loops because this script is scheduled
    # (not event-triggered) and no-ops when the target label is already present.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/menil/jobgitops:latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Project Status Sync
        run: |
          python -m jobgitops.cli.project_sync field-options
          python -m jobgitops.cli.project_sync backfill --reverse
          python -m jobgitops.cli.project_sync field-options --prune
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
