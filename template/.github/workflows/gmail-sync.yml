name: Gmail Sync

on:
  schedule:
    - cron: '0 * * * *'  # hourly
  workflow_dispatch: {}

concurrency:
  group: gmail-sync
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  sync:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/menil/gitemployed:latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Badge (Running)
        if: github.repository != vars.TEMPLATE_REPO
        run: python .github/scripts/update_badge.py "Gmail Sync" "running" "yellow" "gmail-sync-status.json"
        env:
          GIST_ID: ${{ vars.GIST_ID }}
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Run Gmail Sync
        run: |
          set -e
          python -m gitemployed.cli.gmail_sync
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}

      - name: Update Badge (Failed)
        if: failure() && github.repository != vars.TEMPLATE_REPO
        run: python .github/scripts/update_badge.py "Gmail Sync" "failing" "red" "gmail-sync-status.json"
        env:
          GIST_ID: ${{ vars.GIST_ID }}
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Update Badge (Passed)
        if: success() && github.repository != vars.TEMPLATE_REPO
        run: python .github/scripts/update_badge.py "Gmail Sync" "passing" "green" "gmail-sync-status.json"
        env:
          GIST_ID: ${{ vars.GIST_ID }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
