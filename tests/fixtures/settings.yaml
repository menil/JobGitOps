# JobGitOps System Configuration

# Minimum fit score (1.0 to 5.0) required to tailor a resume and apply.
# The AI Triage evaluates fit across tech stack, experience, location, salary, and domain.
fit_threshold: 3.5

# Search settings for the job scraper bot (scrape.py)
search:
  # Enable or disable the daily automated scraping action (set to false to pause search)
  enabled: false

  # Work preference: "remote" (remote only), "onsite" (onsite only), or "hybrid"
  work_preference: "hybrid"

  # Employment type: "fulltime", "contract", "parttime", "internship"
  job_type: "fulltime"

  # Job boards to search on
  platforms:
    - linkedin

  # Search only for jobs posted within the last N hours
  hours_old: 24

# Custom queries override resume-based query generation.
# If empty or commented out, queries are auto-generated from skills and recent position title in resume.yaml.
custom_queries:
  - "Senior Python Developer Remote"

# Optional GitHub Projects V2 integration settings for automated status tracking.
#
# project_id: your project's node ID (starts with "PVT_"). Obtain it from the
#   Projects API: `gh api graphql -f query='query { viewer { projectV2(number: <N>) { id } } }'`
#   (where <N> is your project number, shown in the project URL as
#   github.com/<owner>/<repo>/projects/<N>), or browse to
#   https://api.github.com/graphql and run
#   `query { node(id: "<project's first ProjectV2 id>") { id } }`.
#   IMPORTANT: the placeholder below keeps the integration DISABLED (label-only
#   tracking) until you replace it with a real node ID. A placeholder is
#   treated exactly like an unset value by the automation.
# status_field_name: name of the single-select Status field on the board. The
#   option names must match the lifecycle statuses in src/jobgitops/status_model.py
#   exactly (e.g. "Triage Pending", "Ready to Apply"); run
#   `src/project_sync.py field-options` to align them.
#
# Requires a fine-grained PAT with read/write access to Projects and Issues,
# stored as the GH_PAT repository secret (see README "Secrets").
# When unset, the workflows fall back to GITHUB_TOKEN and Projects V2
# automation degrades to label-only tracking.
projects_v2:
  project_id: "PVT_kwHOAArOl84BfSji"
  status_field_name: "Status"

# Research settings for the Issue Assistant agent (respond.py web tools).
research:
  # Search provider: duckduckgo (default, no key) | tavily (TAVILY_API_KEY) | brave (BRAVE_API_KEY)
  search_provider: duckduckgo

  # Top-N results returned by web_search
  max_results: 5

  # Agent tool-loop iteration cap
  max_iterations: 6

  # Recent comments fed to the model as issue context
  max_context_comments: 10

  # Per-request fetch timeout (seconds)
  timeout_seconds: 15

  # Total request budget including redirects (seconds)
  total_timeout_seconds: 30

  # Maximum redirects followed per fetch
  max_redirects: 5

  # Maximum response body size (1 MiB)
  max_content_bytes: 1048576

  # Politeness delay between DuckDuckGo requests (seconds)
  request_delay: 1.0

  # Use the Jina Reader fallback (r.jina.ai) for JS-heavy / blocked pages.
  # Jina gated the public Reader behind a free API key (jina.ai); set
  # JINA_API_KEY as a repo secret + workflow env to use it (also raises the
  # anonymous 20 RPM limit to 500 RPM). Without a key the plain fetch is used.
  use_jina_reader: true

  # Jina fallback fetches allowed per agent run
  max_jina_calls: 5

  # Reject localhost, loopback, private (RFC1918) and link-local addresses
  block_private_ips: true

  # Optional model override for the responder agent only. Empty (default) uses
  # the provider default (models/gemini-2.5-flash for Gemini,
  # openrouter/free for OpenRouter); triage/tailor keep using
  # GEMINI_MODEL / OPENROUTER_MODEL regardless.
  model: ""
